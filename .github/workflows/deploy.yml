name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Checkout destination
        uses: actions/checkout@v4
        if: github.ref == 'refs/heads/main'
        with:
          ref: gh-pages
          path: built-site
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Hugo CLI
        env:
          HUGO_VERSION: 0.166.0
        run: |
          wget -O ${{ runner.temp }}/hugo.deb https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.deb
          sudo dpkg -i ${{ runner.temp }}/hugo.deb

      - name: Build
        env:
          HUGO_ENVIRONMENT: production
        run: hugo --gc --minify

      - name: Deploy
        if: github.ref == 'refs/heads/main'
        run: |
          # Clean destination directory while preserving .git
          find built-site -mindepth 1 -maxdepth 1 ! -name '.git' -exec rm -rf {} +
          # Copy built site files to destination
          cp -a public/. built-site/
          # Ensure GitHub Pages does not run Jekyll
          touch built-site/.nojekyll
          cd built-site
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --staged --quiet || (git commit -m "Deploy site to gh-pages" && git push origin gh-pages)

