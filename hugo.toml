# Base configuration
baseURL = 'https://blog.servergedoens.de/'
locale = 'de-DE'
defaultContentLanguage = 'de'
title = 'Servergedöns'
theme = 'no-fate'
copyright = 'Servergedöns'
enableRobotsTXT = true

[pagination]
  pagerSize = 10

# Suchfunktion & Feed-Konfiguration
[outputs]
  home = ["HTML", "RSS", "JSON"]

[taxonomies]
  tag = "tags"
  category = "categories"

[params]
  author = 'Servergedöns'
  description = 'Servergedöns – Notizen, Tutorials und Bastelprojekte zu Linux, Docker, Selfhosting und Homelabs.'
  defaultTheme = 'auto'
  disableThemeToggle = false
  ShowReadingTime = true
  ShowBreadCrumbs = true
  ShowPostNavLinks = true
  ShowCodeCopyButtons = true
  ShowShareButtons = false
  mainSections = ["posts"]

  [params.label]
    text = "Servergedöns"

  [params.footer]
    hideCopyright = false
    hidePoweredBy = false
    text = "Verfügbar unter [blog.servergedoens.de](https://blog.servergedoens.de/)"

  [params.noFate]
    style = "wild"
    defaultMode = "editorial"
    defaultAccent = "signal"
    showThemeToggle = true
    showSearch = true
    showReadingTime = true
    showPropositions = false
    enableImageProcessing = true
    validateContentModel = false
    strictHomeSelections = false

    [params.noFate.wild]
      masthead = "Blog"
      issue = ""

    [params.noFate.home]
      modules = ["opening", "selected_writing"]
      featuredProposition = ""

    [params.noFate.archive]
      showArtefactNumbers = false
      showRights = false

    [params.noFate.images]
      widths = [480, 800, 1200, 1600]
      webpQuality = 82

# Navigationsmenü
[menu]
  [[menu.main]]
    identifier = "posts"
    name = "Beiträge"
    url = "/posts/"
    weight = 10
  [[menu.main]]
    identifier = "archives"
    name = "Archiv"
    url = "/archives/"
    weight = 20
  [[menu.main]]
    identifier = "tags"
    name = "Tags"
    url = "/tags/"
    weight = 30
  [[menu.main]]
    identifier = "search"
    name = "Suche"
    url = "/search/"
    weight = 40

[markup]
  [markup.goldmark]
    [markup.goldmark.parser]
      wrapStandAloneImageWithinParagraph = false
      [markup.goldmark.parser.attribute]
        block = true
        title = true
  [markup.highlight]
    codeFences = true
    noClasses = false
